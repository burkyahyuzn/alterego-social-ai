<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALTEREGO - Feed Simülasyonu</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { display: flex; gap: 30px; max-width: 1000px; width: 100%; }
        
        /* Sol Taraf: Sosyal Medya Akışı */
        .feed { flex: 2; height: 90vh; overflow-y: auto; padding-right: 10px; }
        .feed::-webkit-scrollbar { width: 8px; }
        .feed::-webkit-scrollbar-thumb { background-color: #ccc; border-radius: 4px; }
        .post { background: white; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .post-header { font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; background-color: #007bff; border-radius: 50%; display: inline-block; }
        .post-img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; background-color: #ddd; margin-bottom: 10px; }
        .post-btn { background: #f0f2f5; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; width: 100%; }
        .post-btn:hover { background: #e4e6e9; }
        .post-btn.liked { background: #e7f3ff; color: #007bff; }

        /* Sağ Taraf: ALTEREGO Paneli */
        .dashboard { flex: 1; background: white; border-radius: 12px; padding: 20px; height: fit-content; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 20px; }
        .score-box { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; transition: background 0.3s; }
        .score-box h2 { margin: 0; font-size: 32px; }
        .score-box p { margin: 5px 0 0 0; font-size: 14px; opacity: 0.8; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; font-weight: bold; }
        .bar-bg { background: #e4e6e9; height: 10px; border-radius: 5px; width: 100%; margin-bottom: 15px; overflow: hidden; }
        .bar-fill { background: #007bff; height: 100%; transition: width 0.3s; }
    </style>
</head>
<body>

<div class="container">
    <!-- SOSYAL MEDYA AKIŞI -->
    <div class="feed" id="feed-container">
        <!-- Postlar JavaScript ile buraya eklenecek -->
    </div>

    <!-- ALTEREGO DİJİTAL İKİZ PANELİ -->
    <div class="dashboard">
        <h3 style="margin-top: 0;">My Digital Mirror</h3>
        <div class="score-box" id="score-box">
            <h2 id="iai-score">--</h2>
            <p>Intent Alignment Index (IAI)</p>
        </div>
        <p style="font-size: 13px; color: #666; margin-bottom: 20px;">Platform algoritmasının seni hedeflerinden ne kadar uzaklaştırdığını gösterir.</p>
        
        <div id="stats-container">
            <!-- Barlar JavaScript ile eklenecek -->
        </div>
    </div>
</div>

<script>
    let userId = "";

    // Kategoriler ve sahte içerikler
    const contentDB = [
        { cat: "Science", title: "CERN'de yeni bir parçacık keşfi ihtimali!", img: "https://picsum.photos/400/250?random=1" },
        { cat: "Technology", title: "Yapay Zeka modelleri artık kendi kodlarını yazıyor.", img: "https://picsum.photos/400/250?random=2" },
        { cat: "Education", title: "Python ile Algoritma Geliştirme Eğitimi - Bölüm 1", img: "https://picsum.photos/400/250?random=3" },
        { cat: "Entertainment", title: "İnternetin en komik kedi videoları derlemesi 😹", img: "https://picsum.photos/400/250?random=4" },
        { cat: "Sports", title: "Şampiyonlar Ligi'nde inanılmaz geri dönüş!", img: "https://picsum.photos/400/250?random=5" }
    ];

    // Sayfa açıldığında kullanıcıyı başlat
    fetch('/init_user')
        .then(res => res.json())
        .then(data => {
            userId = data.user_id;
            updateDashboard(data.iai, data.state);
            generateFeed();
        });

    function generateFeed() {
        const feed = document.getElementById('feed-container');
        // Rastgele 15 tane post üret
        for(let i=0; i<15; i++) {
            const randomContent = contentDB[Math.floor(Math.random() * contentDB.length)];
            const postHTML = `
                <div class="post">
                    <div class="post-header">
                        <div class="avatar"></div>
                        <span>@${randomContent.cat}_Gundemi</span>
                    </div>
                    <img class="post-img" src="${randomContent.img}" alt="Resim">
                    <h4 style="margin: 10px 0;">${randomContent.title}</h4>
                    <button class="post-btn" onclick="likePost(this, '${randomContent.cat}')">👍 Beğen ve Etkileşime Gir</button>
                </div>
            `;
            feed.innerHTML += postHTML;
        }
    }

    function likePost(buttonElement, category) {
        if(buttonElement.classList.contains('liked')) return; // Zaten beğenildiyse çık
        buttonElement.classList.add('liked');
        buttonElement.innerText = "Beğenildi";

        // Backend'e bildir
        fetch('/interact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: userId, category: category })
        })
        .then(res => res.json())
        .then(data => {
            updateDashboard(data.new_iai, data.new_state);
        });
    }

    function updateDashboard(iai, state) {
        document.getElementById('iai-score').innerText = iai.toFixed(1);
        
        // Skor rengini ayarla (Drift tespiti)
        const scoreBox = document.getElementById('score-box');
        if (iai < 60) { scoreBox.style.background = '#e74c3c'; } // Kırmızı
        else if (iai < 80) { scoreBox.style.background = '#f39c12'; } // Turuncu
        else { scoreBox.style.background = '#2c3e50'; } // Normal Mavi-Gri

        const statsDiv = document.getElementById('stats-container');
        statsDiv.innerHTML = "";
        
        for (const [cat, value] of Object.entries(state)) {
            const percentage = (value * 100).toFixed(1);
            statsDiv.innerHTML += `
                <div class="stat-row"><span>${cat}</span> <span>%${percentage}</span></div>
                <div class="bar-bg"><div class="bar-fill" style="width: ${percentage}%"></div></div>
            `;
        }
    }
</script>

</body>
</html>
